<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#b8341e">
<title>پنل مدیریت — ترشک بندری</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#fdf6ec;--card:#fff;--primary:#b8341e;--primary-dark:#8b2415;
  --mustard:#e8a33d;--text:#2c1810;--soft:#7a6353;--border:#f0e2cf;
  --success:#4a7c59;--danger:#dc2626;
}
body{font-family:'Vazirmatn',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;padding-bottom:40px;padding-top:env(safe-area-inset-top);background-image:radial-gradient(circle at 20% 10%,rgba(232,163,61,.08),transparent 40%),radial-gradient(circle at 80% 80%,rgba(184,52,30,.06),transparent 45%)}

/* اتصال */
#gate{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#b8341e,#8b2415);padding:24px;overflow-y:auto}
.gate-box{background:var(--card);padding:28px 22px;border-radius:22px;width:100%;max-width:380px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.gate-box .lock{font-size:46px;margin-bottom:8px}
.gate-box h1{font-family:'Lalezar',sans-serif;font-size:24px;color:var(--primary-dark);margin-bottom:6px;font-weight:400}
.gate-box p{font-size:12px;color:var(--soft);margin-bottom:18px;line-height:1.8}
.gate-box .field{text-align:right;margin-bottom:12px}
.gate-box .field label{display:block;font-size:12px;font-weight:500;margin-bottom:5px}
.gate-box input[type=text],.gate-box input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;background:var(--bg);outline:none}
.gate-box input[dir=ltr]{text-align:left}
.gate-box input:focus{border-color:var(--primary)}
