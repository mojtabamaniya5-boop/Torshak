<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>بررسی ترشک بندری</title>
<style>
body{font-family:system-ui,Tahoma,sans-serif;background:#fdf6ec;color:#2c1810;margin:0;padding:16px;line-height:1.9}
h1{font-size:18px;margin:0 0 12px}
.box{background:#fff;border:1px solid #f0e2cf;border-radius:14px;padding:10px 14px;margin-bottom:12px}
.row{font-size:13px;padding:4px 0;border-bottom:1px dashed #f0e2cf;word-break:break-word}
.row:last-child{border-bottom:none}
.ok{color:#15803d}.bad{color:#b91c1c}.warn{color:#b45309}
button{width:100%;padding:13px;border:0;border-radius:12px;background:#b8341e;color:#fff;font-size:14px;font-weight:700;margin-bottom:10px;font-family:inherit}
button.alt{background:#fff;color:#2c1810;border:1.5px solid #f0e2cf}
button:disabled{opacity:.5}
a.btn{display:block;text-align:center;padding:12px;border-radius:12px;border:1.5px solid #f0e2cf;background:#fff;color:#2c1810;text-decoration:none;font-size:13.5px;margin-bottom:8px}
</style>
</head>
<body>
<h1>بررسی سایت ترشک بندری</h1>
<div class="box" id="out"><div class="row warn">در حال بررسی…</div></div>
<button id="clearBtn">🧹 پاک‌سازی کش برنامه</button>
<button class="alt" id="copyBtn">📋 کپی گزارش</button>
<a class="btn" href="./">باز کردن سایت</a>
